---

- name: Get installed k3s version
  shell: 
    cmd: /usr/local/bin/k3s -v | head -1 | awk '{ print $3 }'
  register: k3s_installed_version
  changed_when: false

- name: Update k3s to version specified in k3s_version
  block:
    - name: Install k3s automated upgrade controller
      command:
        cmd: kubectl apply -f https://github.com/rancher/system-upgrade-controller/releases/latest/download/system-upgrade-controller.yaml

    - name: Install CRDs for automated upgrade controller
      command:
        cmd: kubectl apply -f https://github.com/rancher/system-upgrade-controller/releases/latest/download/crd.yaml

    - name: Update k3s version from {{ k3s_installed_verison }} to {{ k3s_version }}
      command:
        cmd: |
          kubectl apply -f - <<EOF 
          apiVersion: upgrade.cattle.io/v1
          kind: Plan
          metadata:
            name: server-plan
            namespace: system-upgrade
          spec:
            concurrency: 1
            cordon: true
            nodeSelector:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: In
                values:
                - "true"
            serviceAccountName: system-upgrade
            upgrade:
              image: rancher/k3s-upgrade
            version: {{ k3s_version }}
          EOF
  when: k3s_version != k3s_installed_version.stdout
